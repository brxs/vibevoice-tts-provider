# VibeVoice TTS Provider Configuration

[server]
listen_addr = "[::1]:50051"

[vibevoice]
api_url = "http://127.0.0.1:8000/v1"
model = "vibevoice/VibeVoice-7B"
ddpm_steps = 20
cfg_scale = 3.0

[voices]
default = "primavera"

[voices.primavera]
path = "/home/plantoidz/Documents/VibeVoice-API-main/primavera.wav"
display_name = "Primavera"

