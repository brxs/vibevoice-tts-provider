[package]
name = "vibevoice-tts-provider"
version = "0.1.0"
edition = "2021"
description = "gRPC TTS provider service wrapping VibeVoice"

[dependencies]
# gRPC
tonic = "0.13"
prost = "0.13"

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
futures-util = "0.3"
bytes = "1"

# HTTP client for VibeVoice API
reqwest = { version = "0.12", features = ["json", "stream"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Base64 decoding for audio chunks
base64 = "0.22"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
thiserror = "2"

# TUI
ratatui = "0.29"
crossterm = "0.28"

[build-dependencies]
tonic-build = "0.13"
